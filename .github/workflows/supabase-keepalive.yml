# Supabase pausa los proyectos gratuitos tras 7 días sin actividad.
# Este workflow hace una consulta mínima cada 3 días para mantenerlo activo.
name: Supabase keep-alive

on:
  schedule:
    - cron: "0 12 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base de datos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/visited_countries?select=country_code&limit=1" \
            -H "apikey: $SUPABASE_KEY")
          echo "HTTP $status"
          test "$status" = "200"
